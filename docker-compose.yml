version: '3.8'

services:
  # Microservicio 1: Restaurant Service
  restaurant-service:
    build:
      context: ./backend
    container_name: restaurant-service
    expose:
      - "8080"
    environment:
      - CLIENT_PREFERENCES_SERVICE_URL=http://client-preferences-service:8082
      - DB_URL=${RESTAURANT_DB_URL}
      - DB_USERNAME=${RESTAURANT_DB_USERNAME}
      - DB_PASSWORD=${RESTAURANT_DB_PASSWORD}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
      - COGNITO_APP_CLIENT_ID=${COGNITO_APP_CLIENT_ID}
      - COGNITO_DOMAIN_BASE=${COGNITO_DOMAIN_BASE}
      - COGNITO_REDIRECT_URI=${COGNITO_REDIRECT_URI}
      - COGNITO_ISSUER_URI=${COGNITO_ISSUER_URI}
    depends_on:
      - client-preferences-service
    networks:
      - app-network

  # Microservicio 2: Client Preferences Service
  client-preferences-service:
    build:
      context: ./client-preferences-service
    container_name: client-preferences-service
    expose:
      - "8082"
    environment:
      - DB_URL=${PREFERENCES_DB_URL}
      - DB_USERNAME=${PREFERENCES_DB_USERNAME}
      - DB_PASSWORD=${PREFERENCES_DB_PASSWORD}
      - COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID}
      - COGNITO_APP_CLIENT_ID=${COGNITO_APP_CLIENT_ID}
      - COGNITO_DOMAIN_BASE=${COGNITO_DOMAIN_BASE}
      - COGNITO_REDIRECT_URI=${COGNITO_REDIRECT_URI}
      - COGNITO_ISSUER_URI=${COGNITO_ISSUER_URI}
    networks:
      - app-network

  # Reverse Proxy: Nginx
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80" # Cumple la regla de exposición en puerto 9090 del Host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
    depends_on:
      - restaurant-service
      - client-preferences-service
    networks:
      - app-network

networks:
  app-network:
    driver: bridge